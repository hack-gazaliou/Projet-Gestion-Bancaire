[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gestion_bancaire"
version = "0.1.0"
description = "Setup script for the gestion_bancaire package"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mkdocstrings[python]>=0.18"
    # "pandas>=1.3.0",
    # "openpyxl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pylint",
    "ruff",
]

[project.scripts]
    gestion_bancaire = "gestion_bancaire.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Conf ruff

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C90"] # Error, Warning, Unused variables / imports, Isort, bugbeart, cyclomatique complexity
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"